<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
    <h2>Вход в систему</h2>
    {% if form.errors %}
        <p style="color:red;">Неверное имя пользователя или пароль.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="id_username">Имя пользователя:</label>
        {{ form.username }}<br>
        <label for="id_password">Пароль:</label>
        {{ form.password }}<br>
        <button type="submit">Войти</button>
    </form>
    <p>
        Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
    </p>
</body>
</html>
