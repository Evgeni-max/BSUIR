{% extends "core/base.html" %}
{% block title %}Графики продаж{% endblock %}
{% block content %}
<h2>Распределение выручки по отделам</h2>
<canvas id="deptChart" width="600" height="300"></canvas>
<h2>Динамика выручки по датам</h2>
<canvas id="dateChart" width="600" height="300"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const deptCtx = document.getElementById('deptChart').getContext('2d');
new Chart(deptCtx, {
    type: 'bar',
    data: {
        labels: {{ dept_labels|safe }},
        datasets: [{
            label: 'Выручка по отделам',
            data: {{ dept_data|safe }},
            backgroundColor: 'rgba(54, 162, 235, 0.5)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
        }]
    },
    options: {scales: {y: {beginAtZero: true}}}
});

const dateCtx = document.getElementById('dateChart').getContext('2d');
new Chart(dateCtx, {
    type: 'line',
    data: {
        labels: {{ date_labels|safe }},
        datasets: [{
            label: 'Выручка по датам',
            data: {{ date_data|safe }},
            fill: false,
            borderColor: 'rgba(255, 99, 132, 1)',
            tension: 0.1
        }]
    },
    options: {scales: {y: {beginAtZero: true}}}
});
</script>
{% endblock %}
