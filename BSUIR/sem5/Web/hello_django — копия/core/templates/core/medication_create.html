{% extends "core/base.html" %}

{% block title %}Добавить медикамент{% endblock %}

{% block content %}
<h2>Добавить медикамент</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Название: <input type="text" name="name" required></label><br>
    <label>Код: <input type="text" name="code" required></label><br>
    <label>Цена: <input type="number" name="price" step="0.01" required></label><br>
    <label>Отдел:
        <select name="department" required>
            {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.name }}</option>
            {% endfor %}
        </select>
    </label><br>
    <label>Лечащее средство:
        <select name="remedy" required>
            {% for remedy in remedies %}
                <option value="{{ remedy.id }}">{{ remedy.name }}</option>
            {% endfor %}
        </select>
    </label><br>
    <label>Поставщики:
        <select name="suppliers" multiple>
            {% for supplier in suppliers %}
                <option value="{{ supplier.id }}">{{ supplier.name }}</option>
            {% endfor %}
        </select>
    </label><br>
    <label>Инструкция:<br>
        <textarea name="instruction" rows="3"></textarea>
    </label><br>
    <label>Описание:<br>
        <textarea name="description" rows="3"></textarea>
    </label><br>
    <label>Фото: <input type="file" name="photo"></label><br>
    <button type="submit">Создать</button>
    <a href="{% url 'medication_list' %}"><button type="button">Отмена</button></a>
</form>
{% endblock %}
