<form method="post">
    {% csrf_token %}
    <label>Оценка:
        <input type="number" name="rating" min="1" max="5" required>
    </label>
    <br>
    <label>Текст:
        <textarea name="text" required minlength="10"></textarea>
    </label>
    <br>
    <button type="submit">Отправить</button>
</form>
